        - generic [ref=f19e448]:
          - img "Note.png" [ref=f19e450]
          - strong [ref=f19e451]: "Note:"
          - generic [ref=f19e452]:
            - text: When Left 4 Dead 2 was released, only 5 campaigns (Dead Center, Dark Carnival, Swamp Fever, Hard Rain and The Parish) were available.
            - list [ref=f19e453]:
              - listitem [ref=f19e454]:
                - text: In October 5, 2010, the No Mercy campaign (from
                - link "Left 4 Dead" [ref=f19e455] [cursor=pointer]:
                  - /url: /wiki/Left_4_Dead
                - text: ), was ported to
                - generic [ref=f19e456] [cursor=pointer]: Left 4 Dead 2
                - text: . The Sacrifice (available on both
                - link "Left 4 Dead" [ref=f19e457] [cursor=pointer]:
                  - /url: /wiki/Left_4_Dead
                - text: and
                - generic [ref=f19e458] [cursor=pointer]: Left 4 Dead 2
                - text: ", taking place after"
                - link [ref=f19e460] [cursor=pointer]:
                  - /url: /wiki/Left_4_Dead
                  - img "Left 4 Dead" [ref=f19e461]
                - text: Blood Harvest), was released.
              - listitem [ref=f19e462]:
                - text: The rest of
                - link [ref=f19e464] [cursor=pointer]:
                  - /url: /wiki/Left_4_Dead
                  - img "Left 4 Dead" [ref=f19e465]
                - link "Left 4 Dead" [ref=f19e466] [cursor=pointer]:
                  - /url: /wiki/Left_4_Dead
                - text: "'s campaigns were later ported to"
                - generic [ref=f19e467] [cursor=pointer]: Left 4 Dead 2
                - text: on March 22, 2011. That same day, Cold Stream was also released in a beta state, until later being fully released on July 24th, 2012 (and August 3rd, 2012 for
                - link "Xbox 360" [ref=f19e468] [cursor=pointer]:
                  - /url: http://en.wikipedia.org/wiki/Xbox_360
                - text: ).
              - listitem [ref=f19e469]:
                - text: The Last Stand campaign is not available on the
                - link [ref=f19e471] [cursor=pointer]:
                  - /url: http://en.wikipedia.org/wiki/Xbox_360
                  - img "Xbox 360" [ref=f19e472]
                - link "Xbox 360" [ref=f19e473] [cursor=pointer]:
                  - /url: http://en.wikipedia.org/wiki/Xbox_360
                - text: version of the game.
              - listitem [ref=f19e474]: All of these new campaigns and L4D1 campaign port are released as an update on PC, and as a optional paid DLC on Xbox 360.
        - generic [ref=f19e475]:
          - img "Icon-Important.png" [ref=f19e477]
          - strong [ref=f19e478]: "Important:"
          - generic [ref=f19e479]:
            - text: Since March - June 2023, Left 4 Dead 2 is no longer available to purchase on Xbox 360 (prior to Xbox Marketplace shutting down on Xbox 360 in July 2024). As the Xbox Marketplace on Xbox 360 has been shutdown, the Left 4 Dead 2 DLC campaigns (The Passing, The Sacrifice, all Left 4 Dead campaigns and Cold Stream) are no longer available to purchase on
            - link "Xbox 360" [ref=f19e480] [cursor=pointer]:
              - /url: http://en.wikipedia.org/wiki/Xbox_360
            - text: ", even on newer Xbox ("
            - link "Xbox One" [ref=f19e481] [cursor=pointer]:
              - /url: http://en.wikipedia.org/wiki/Xbox_One
            - text: /
            - link "Xbox Series X/S" [ref=f19e482] [cursor=pointer]:
              - /url: http://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
            - text: ). Users who already purchased the DLC campaigns before the Xbox 360 Marketplace shutdown will be able to play DLC campaigns on newer Xbox consoles.
            - superscript [ref=f19e484]:
              - link "[2]" [ref=f19e485] [cursor=pointer]:
                - /url: "#ref2"
