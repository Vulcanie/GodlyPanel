        - heading "Other versions of Left 4 Dead 2" [level=2] [ref=f19e298]
        - heading "Demo version" [level=3] [ref=f19e299]
        - paragraph [ref=f19e300]: The demo version only features two playable maps, taking place in the The Parish campaign.
        - paragraph [ref=f19e301]:
          - text: On PC, while demo version of the game is no longer available (after release), the Xbox 360 demo version is still playable, but has been delisted due to the shutdown of Xbox 360 Marketplace, and the demo version is not available on newer Xbox consoles via backward compatibility (
          - link "Xbox One" [ref=f19e302] [cursor=pointer]:
            - /url: http://en.wikipedia.org/wiki/Xbox_One
          - text: ","
          - link "Xbox Series X/S" [ref=f19e303] [cursor=pointer]:
            - /url: http://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
          - text: ).
        - heading "Console version" [level=3] [ref=f19e304]
        - paragraph [ref=f19e305]:
          - text: Similar to Left 4 Dead, Left 4 Dead 2 was only released for the
          - link "Xbox 360" [ref=f19e306] [cursor=pointer]:
            - /url: http://en.wikipedia.org/wiki/Xbox_360
          - text: console.
        - paragraph [ref=f19e307]: "The Xbox 360 version, aside from graphical differences, is nearly identical to the PC version before 2013, but there are some differences:"
        - list [ref=f19e308]:
          - listitem [ref=f19e309]: "Menu: Menus are now identical on both platform, however in PC version, after The Last Stand update in 2020, slightly changed the quit message and moved Singleplayer option (which was originally separated) to \"Play Campaign\", \"Play Survival\" or \"Play Realism\"."
          - listitem [ref=f19e310]: "Downloadable Content and updates: Similar to Left 4 Dead, the console version of the game received all content updates (such as new campaigns) up to 2012 (Cold Stream). However unlike the PC version which was free, these downloadable content must be purchased on the Xbox 360. Additionally, the console version did not received any engine updates or bug fixes, only receiving content updates. Later in 2020, the PC version received The Last Stand community update, which was exclusive to PC only."
          - listitem [ref=f19e311]: "Multiplayer: Xbox 360 version - online features are powered by Xbox Live (requires Xbox Game Pass Core subscription, formerly Xbox Live Gold), and PC version is powered by Steam. Both servers are still active as of 2026."
        - paragraph [ref=f19e312]:
          - text: The Xbox 360 version is backward compatible with
          - link "Xbox One" [ref=f19e313] [cursor=pointer]:
            - /url: http://en.wikipedia.org/wiki/Xbox_One
          - text: and
          - link "Xbox Series X/S" [ref=f19e314] [cursor=pointer]:
            - /url: http://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
          - text: ", with resolution enhancements (up to 4K) on Xbox One X (or Series X/S), however the game is no longer available digitally on Xbox 360, since it was delisted around March - May 2023 for unknown reasons, even before Xbox 360 Marketplace was shutdown in June 2024. The game is also not available for purchase digitally on modern Xbox consoles. Obtaining physical copy of the game is now the only way to play it on Xbox 360 or modern Xbox consoles. Additionally, with the Xbox 360 Marketplace completely shutdown and DLCs no longer available on newer Xbox consoles, if you haven't purchased the DLCs prior it being delisted along with Xbox 360 Marketplace completely shutdown, you are no longer able to get them."
        - heading "Limitations/Bugs" [level=2] [ref=f19e315]
