        - paragraph [ref=f19e157]:
          - img "Left 4 Dead 2" [ref=f19e159]
          - text: Left 4 Dead 2 is a co-op first person shooter. The game is a sequel to
          - link [ref=f19e161] [cursor=pointer]:
            - /url: /wiki/Left_4_Dead
            - img "Left 4 Dead" [ref=f19e162]
          - link "Left 4 Dead" [ref=f19e163] [cursor=pointer]:
            - /url: /wiki/Left_4_Dead
          - text: . Players are one of four new survivors armed with a wide and devastating array of classic and upgraded weapons, fighting against hordes of zombies known as the Infected. In addition to firearms, a variety of carnage-creating melee weapons have been added, from chainsaws to axes and even the exceptionally deadly frying pan.
        - paragraph [ref=f19e164]:
          - text: Left 4 Dead 2 features new campaigns and more game modes, along with improvements to
          - link "Left 4 Dead engine branch" [ref=f19e165] [cursor=pointer]:
            - /url: /wiki/Left_4_Dead_engine_branch
          - text: . The game received a major update in 2020, known as The Last Stand Community Update, which brings
          - link "various bug fixes, new features and content" [ref=f19e166] [cursor=pointer]:
            - /url: "#History"
          - text: to the game.
