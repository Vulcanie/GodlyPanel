        - heading "History" [level=2] [ref=f19e227]
        - paragraph [ref=f19e228]:
          - text: Plans for the sequel to
          - link "Left 4 Dead" [ref=f19e229] [cursor=pointer]:
            - /url: /wiki/Left_4_Dead
          - text: begins after it was released, and Valve wanted to make the game "bigger and better". Before Left 4 Dead 2 was released, some Left 4 Dead players boycott Left 4 Dead 2 and formed a Steam group called "L4D2 Boycott (NO-L4D2)", grewing over 37,000 months later when the group was created.
        - paragraph [ref=f19e230]:
          - text: These complaints led to
          - link "Valve" [ref=f19e231] [cursor=pointer]:
            - /url: /wiki/Valve
          - text: marketer Doug Lombardi stated that the announcement of Left 4 Dead 2 at E3 should not be taken to indicate that Valve would no longer support the first game and asked the community to "trust them a little bit". Despite this, the boycott was later deemed a failure as users on the L4D2 Boycott group pre-ordered the game before it's release, and played the game after it was released.
        - paragraph [ref=f19e232]:
          - text: At one point during development, there was a build of Left 4 Dead 2 from
          - link "Aug 6, 2009" [ref=f19e233] [cursor=pointer]:
            - /url: https://hiddenpalace.org/Left_4_Dead_2_(Aug_6,_2009_prototype)
          - text: (discovered as part of Aug 2026's Steam2 content delivery leak), that requires PhysX installed in order for the game to load a map. Whether PhysX was originally intended to be added to Left 4 Dead 2 before being removed in final build, or PhysX being used to generate
          - link "baked physics" [ref=f19e234] [cursor=pointer]:
            - /url: /wiki/Baked_physics
          - text: on the dev build only remains unknown, although the
          - code [ref=f19e235]: hybridphysx
          - text: folder remain present on final build of L4D2, with 3 props inside the folder.
        - paragraph [ref=f19e236]: Left 4 Dead 2 was released in November 17, 2009 for Windows and Xbox 360. The game was later ported to Mac OS X (macOS) in October 5, 2010, and Linux in July 2, 2013.
        - paragraph [ref=f19e237]:
          - text: In 2020, a major Left 4 Dead 2 update,
          - generic [ref=f19e238]:
            - link [ref=f19e240] [cursor=pointer]:
              - /url: https://left4deadwiki.com/wiki/The_Last_Stand_Community_Update
            - link "The Last Stand Community Update" [ref=f19e241] [cursor=pointer]:
              - /url: https://left4deadwiki.com/wiki/The_Last_Stand_Community_Update
          - text: ", was released in September 24, 2020. This updates brings major bug fixes, UI improvements, The Last Stand campaign (based on the L4D1's Survivor map with the same name), brings Versus Survival to the Main Menu, which was formerly a mutation gamemode, 26 new Survival maps based on Left 4 Dead and the previously hidden Left 4 Dead 2 survival maps, 4 new Scavenge arenas based on L4D, 30 additional new achievements, two new Mutations: \"RocketDude\" and \"Tank Run\". The update also brings the"
          - 'link "Counter-Strike: Source" [ref=f19e242] [cursor=pointer]':
            - /url: /wiki/Counter-Strike:_Source
          - text: weapons (once exclusive to German version due to censorship law or by playing with someone that owns a German copy of the game) to all users in any country. The update also adds other changes which can be seen on
          - link [ref=f19e244] [cursor=pointer]:
            - /url: https://left4deadwiki.com/wiki/The_Last_Stand_Community_Update
          - link "this page" [ref=f19e245] [cursor=pointer]:
            - /url: https://left4deadwiki.com/wiki/The_Last_Stand_Community_Update
          - text: .
