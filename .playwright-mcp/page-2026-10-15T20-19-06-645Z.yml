            - link "Left 4 Dead" [ref=f19e321] [cursor=pointer]:
              - /url: /wiki/Left_4_Dead
            - text: ", Left 4 Dead 2 and some newer Source games will have most of the console commands & console variables restricted/hidden by default, such as"
            - code [ref=f19e322]: mat_specular
            - text: . However, you can use these commands by using
            - link "VScript" [ref=f19e323] [cursor=pointer]:
