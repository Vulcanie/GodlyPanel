        - paragraph [ref=f8e69]:
          - text: The Source Dedicated Server (or SRCDS) is a tool that runs the server component of a
          - link [ref=f8e71] [cursor=pointer]:
            - /url: /wiki/Source
            - img "Source" [ref=f8e72]
          - link "Source" [ref=f8e73] [cursor=pointer]:
            - /url: /wiki/Source
          - text: game without the client component.
        - paragraph [ref=f8e74]: In other words, it simulates the game without drawing it. SRCDS is chiefly used by server providers who want to serve up as many games from the same computer as they can.
        - paragraph [ref=f8e75]: This page, however, is aimed at mod developers who want to run SRCDS on their home computer. Doing this is a must if you are creating a multiplayer mod as the behaviour of dedicated servers differs from that of listenservers (those started from the main menu) in some areas. Crashes that only happen on a dedicated server are entirely possible!
        - heading "Hardware requirements" [level=2] [ref=f8e76]
        - paragraph [ref=f8e77]: CPU - Depends on how many clients connected to the servers. To run a Source dedicated server you need at least a 1.0GHz Intel CPU or equivalent, many newer and mid-range CPU usually perform better. This will run a basic server with 20 slots at a good level of performance.
        - paragraph [ref=f8e78]: "Memory: To run a normal server you will need at least 512MB RAM, you might need to restart the server every once in a while to clean up the memory. 1GB is enough to run over 60 player slots total. Please note that newer versions of Windows, such as Windows 10/11 (or some Linux distros) for example, it's highly recommended you to have at least 4GB RAM or more."
        - paragraph [ref=f8e79]: "Bandwidth: Bandwidth is used a lot—more specifically, upload bandwidth. Here is a list of how fast your connection must be to run a certain number of players at lowest settings. (When talking about bandwidth for servers we always talk about upload, not download.) Note: these numbers are theoretical, your results may vary slightly!"
        - heading "Connectivity" [level=2] [ref=f8e80]
        - paragraph [ref=f8e81]: No matter which type of server you are using, your computer must be able to receive unsolicited incoming connections. This is exactly what routers and software firewalls exist to prevent, so if you are using either you will have to reconfigure. Refer to the manufacturer instructions for how to do this.
        - paragraph [ref=f8e82]: "The ports SRCDS officially requires are:"
        - list [ref=f8e83]:
          - listitem [ref=f8e84]:
            - text: 27015 TCP/UDP (game transmission, pings and
            - link "RCON" [ref=f8e85] [cursor=pointer]:
              - /url: /wiki/RCON
            - text: ) - Can be changed using -port on startup
          - listitem [ref=f8e86]:
            - text: 27020 UDP (
            - link "SourceTV" [ref=f8e87] [cursor=pointer]:
              - /url: /wiki/SourceTV
            - text: transmission) - Can be changed using +tv_port on startup
          - listitem [ref=f8e88]: 27005 UDP (Client Port) - Can be changed using -clientport on startup
          - listitem [ref=f8e89]: 26900 UDP (Steam Port, outgoing) - Can be changed using -sport on startup
        - paragraph [ref=f8e90]: SRCDS has also been spotted opening connections on 27005 and 51840 UDP, but these may be outbound only.
        - generic [ref=f8e91]:
          - img "Tip.png" [ref=f8e93]
          - strong [ref=f8e94]: "Tip:"
          - generic [ref=f8e95]:
            - text: Pinging your own server will fail with some routers and/or ISPs. The most reliable way to test whether your connection is open is either to get a friend to try connecting, or to install the
            - link "Microsoft Network Monitor" [ref=f8e96] [cursor=pointer]:
              - /url: https://www.microsoft.com/en-gb/download/details.aspx?id=4865
            - text: (apply the filter
            - code [ref=f8e97]: Udp.Port == 27015
            - text: ) and watch for requests coming in from random people around the world. Note that the heartbeats you will see being sent to the two master servers do not mean that the connection is open.
        - generic [ref=f8e98]:
          - img "Note.png" [ref=f8e100]
          - strong [ref=f8e101]: "Note:"
          - generic [ref=f8e102]: A residential internet connection may not have the upload capacity to support large games.
        - generic [ref=f8e103]:
          - img "Note.png" [ref=f8e105]
          - strong [ref=f8e106]: "Note:"
          - generic [ref=f8e107]: Using service providers which use CGNAT (such as mobile providers or an increasing amount of residential providers) may make it impossible to host any kind of server.
        - generic [ref=f8e108]:
          - img "Note.png" [ref=f8e110]
          - strong [ref=f8e111]: "Note:"
          - generic [ref=f8e112]:
            - text: Servers won't respond to
            - link "queries" [ref=f8e113] [cursor=pointer]:
              - /url: /wiki/Server_queries
            - text: until a map is loaded.
        - generic [ref=f8e114]:
          - img "Note.png" [ref=f8e116]
          - strong [ref=f8e117]: "Note:"
          - generic [ref=f8e118]: A residential internet connection may not have the upload capacity to support large games.
        - generic [ref=f8e119]:
          - img "Note.png" [ref=f8e121]
          - strong [ref=f8e122]: "Note:"
          - generic [ref=f8e123]:
            - text: If you receive the error "Could not establish connection to Steam servers." with a result number of 18 or 106,
            - link "you need to go here" [ref=f8e124] [cursor=pointer]:
              - /url: https://steamcommunity.com/dev/managegameservers
            - text: and either regenerate your token, or create a new one and replace it in your sv_setsteamaccount startup parameter
        - heading "Installation" [level=2] [ref=f8e125]
        - paragraph [ref=f8e126]:
          - text: See
          - link "SteamCMD" [ref=f8e127] [cursor=pointer]:
            - /url: /wiki/SteamCMD
          - text: for installation instructions.
        - heading "For modders" [level=3] [ref=f8e128]
        - generic [ref=f8e129]:
          - img "Note.png" [ref=f8e131]
          - strong [ref=f8e132]: "Note:"
          - generic [ref=f8e133]:
            - text: The HLDS Update Tool does not provide
            - link "Lost Coast" [ref=f8e134] [cursor=pointer]:
              - /url: /wiki/Lost_Coast
            - text: ", even though"
            - link "SDK Base" [ref=f8e135] [cursor=pointer]:
              - /url: /wiki/SDK_Base
            - text: does. Multiplayer mods should either not use anything from Lost Coast, or include what they do use in their dedicated server download.
        - generic [ref=f8e136]:
          - img "Note.png" [ref=f8e138]
          - strong [ref=f8e139]: "Note:"
          - generic [ref=f8e140]: The appid for Source 2006 server is 205. The appid for Source 2007 server is 310. The appid for Source 2013 server is 244310.
        - list [ref=f8e141]:
          - listitem [ref=f8e142]:
            - text: Install
            - link "SteamCMD" [ref=f8e143] [cursor=pointer]:
              - /url: /wiki/SteamCMD
          - listitem [ref=f8e144]:
            - text: Run the update tool with
            - code [ref=f8e145]: +login anonymous +app_update [appid]
            - text: . The appid you should use is listed in a note above. Optionally, add
            - code [ref=f8e146]: +force_install_dir <path>
            - text: to download to a custom location; it must appear before the
            - code [ref=f8e147]: +app_update
            - text: command.
          - listitem [ref=f8e148]:
            - text: To start the server, run
            - code [ref=f8e149]:
              - text: orangebox\srcds.exe -console -game
              - link "<vproject>" [ref=f8e150] [cursor=pointer]:
                - /url: /wiki/Game_Directory
            - text: .
        - generic [ref=f8e151]:
          - img "Tip.png" [ref=f8e153]
          - strong [ref=f8e154]: "Tip:"
          - generic [ref=f8e155]:
            - text: If you already have the game client installed, you can cancel the tool with
            - generic [ref=f8e156]: Ctrl+C
            - text: once it starts downloading materials in step 1. You can skip the bulk of the downloading by extracting the GCFs already on your system with
            - link "GCFScape" [ref=f8e158] [cursor=pointer]:
              - /url: /wiki/GCFScape
            - text: instead.
            - list [ref=f8e159]:
              - listitem [ref=f8e160]: You will need to extract sounds, materials and models; do the "source X" GCFs before the "source 2007 X" ones.
              - listitem [ref=f8e161]:
                - text: You should end up with
                - code [ref=f8e162]: <server_path>\hl2
                - text: from your GCFs and
                - code [ref=f8e163]: <server_path>\orangebox
                - text: from the update tool.
              - listitem [ref=f8e164]: You may want to run the update tool again after extracting to make sure that everything is correct.
        - heading "Configuring and running the server" [level=2] [ref=f8e165]
        - paragraph [ref=f8e166]:
          - text: Navigate to the folder you just installed your server in. There should be a bunch of files and folders, including a directory with the name of the game you have just installed, e.g.
          - code [ref=f8e167]: hl2mp
          - text: for
          - 'link "HL2: Deathmatch" [ref=f8e168] [cursor=pointer]':
            - /url: /wiki/Half-Life_2:_Deathmatch
          - text: . The configuration files are located in the
          - code [ref=f8e169]: <game>/cfg/
          - text: e.g.
          - code [ref=f8e170]: hl2mp/cfg/
          - text: directory.
        - paragraph [ref=f8e171]:
          - text: "Edit the main configuration file:"
          - code [ref=f8e172]: <game>/cfg/server.cfg
          - text: . Change the
          - code [ref=f8e173]: hostname
          - text: line (this is the name people will see in the server browser) and other options to your liking.
        - paragraph [ref=f8e174]: "Open a terminal where you have installed the server and start the server:"
        - generic [ref=f8e175]: ./srcds_run (or ./srcds.exe on Windows) -game <game> +map <map> +maxplayers X -autoupdate
        - paragraph [ref=f8e176]: "On Windows:"
        - generic [ref=f8e177]: ./srcds.exe -game <game> +map <map> +maxplayers X -autoupdate
        - paragraph [ref=f8e178]: "For example:"
        - generic [ref=f8e179]: ./srcds_run -game hl2mp +map dm_lockdown +maxplayers 8 -autoupdate
        - paragraph [ref=f8e180]
        - paragraph [ref=f8e181]
        - generic [ref=f8e182]:
          - img "Note.png" [ref=f8e184]
          - strong [ref=f8e185]: "Note:"
          - generic [ref=f8e186]:
            - text: "On OS Linux, if server stop on this message when launched:"
            - generic [ref=f8e187]: "Failed to open bin/dedicated_srv.so (bin/libstdc++.so.6: version `CXXABI_1.3.8' not found (required by bin/dedicated_srv.so))"
            - paragraph [ref=f8e188]:
              - text: ...go in server
              - code [ref=f8e189]: /bin
              - text: folder and look file
              - code [ref=f8e190]: libstdc++.so.6
              - text: ", rename or delete this file. I understand that this file is extra, coming from valve. You not need that."
