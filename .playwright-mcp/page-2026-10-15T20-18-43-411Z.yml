        - paragraph [ref=f10e20]:
          - text: This is a sortable table of a few categories of Valve-related dedicated server info (all games provided by the
          - link "HLDSUpdateTool" [ref=f10e21] [cursor=pointer]:
            - /url: /wiki/HLDSUpdateTool
          - text: ", along with their mods), mostly for server administrators. The update name is used with the update tool's"
          - code [ref=f10e22]: "-game"
          - link "command line option" [ref=f10e23] [cursor=pointer]:
            - /url: /wiki/Command_Line_Options
          - text: . The launch name is used with the
          - link "Source" [ref=f10e24] [cursor=pointer]:
            - /url: /wiki/Source_Dedicated_Server
          - text: and
          - link "Goldsource" [ref=f10e25] [cursor=pointer]:
            - /url: /wiki/Goldsource
          - text: dedicated server's
          - code [ref=f10e26]: "-game"
          - link "command line option" [ref=f10e27] [cursor=pointer]:
            - /url: /wiki/Command_Line_Options
          - text: ", and the"
          - code [ref=f10e28]: \gamedir\
          - link "master server query protocol" [ref=f10e29] [cursor=pointer]:
            - /url: /wiki/Master_Server_Query_Protocol
          - text: filter. The path is the directory path (relative to the update tool
          - code [ref=f10e30]: "-dir"
          - text: ) and name of the main server executable. If the game is a mod and requires files from sources other than the update tool, it is external.
