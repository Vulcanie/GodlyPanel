name: Release

# Builds the portable Windows zip and attaches it to a GitHub Release.
# Run it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
# or by hand from the Actions tab.
#
# Three jobs: the tests (four machines at once) and the build run side by side, and the
# zip is only published once both have passed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  package:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: npm run setup

      - name: Build the interface and package the app
        run: npm run package

      # The small app-only update the in-app updater downloads when Electron hasn't changed (see docs/UPDATING.md).
      - name: Build the in-app update
        run: node scripts/make-update-payload.mjs

      # Handed to the next job (and, when signing is set up, to SignPath).
      - name: Keep the zip
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: GodlyPanel-unsigned
          path: |
            dist/GodlyPanel-*-win.zip
            dist/GodlyPanel-*-app.zip
            dist/update-info.json
          retention-days: 7

  publish:
    needs: [tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # For scripts/release-manifest.mjs, which writes the update manifest below.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: GodlyPanel-unsigned
          path: dist

      # Code signing (see docs/CODE_SIGNING.md). Only runs once the SignPath settings exist in the
      # repository; until then the zip is released unsigned, exactly as before.
      - name: Sign it with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: godlypanel
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.package.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed zip
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          rm -f dist/GodlyPanel-*-win.zip
          cp signed/*.zip dist/

      # What the in-app updater reads first: both downloads, their sizes and checksums, and the Electron version. Made
      # here, from the final zips, so the checksums are of exactly what is attached.
      - name: Write the update manifest
        run: node scripts/release-manifest.mjs dist

      - name: Attach the zips to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GodlyPanel-*-win.zip
            dist/GodlyPanel-*-app.zip
            dist/update-manifest.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # A manual run has no tag to release to: the zip stays as the artifact above for a week.
