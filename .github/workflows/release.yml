name: Release

# Builds the portable Windows zip and attaches it to a GitHub Release.
# Run it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
# or by hand from the Actions tab. (Not yet exercised: this file was written
# before the first release was cut, so expect to adjust it on its first run.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - run: npm run setup

      - name: Run the tests before building anything
        run: npm test

      - name: Build the interface and package the app
        run: npm run package

      # Code signing (see docs/CODE_SIGNING.md). Only runs once the SignPath settings exist in the
      # repository; until then the zip is released unsigned, exactly as before.
      - name: Upload the unsigned zip for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GodlyPanel-unsigned
          path: dist/GodlyPanel-*-win.zip

      - name: Sign it with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: godlypanel
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed zip
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "GodlyPanel-*-win.zip" | Remove-Item
          Copy-Item signed/*.zip dist/

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GodlyPanel-*-win.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Keep the zip as a workflow artifact too (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: GodlyPanel-windows-zip
          path: dist/GodlyPanel-*-win.zip
          retention-days: 7
